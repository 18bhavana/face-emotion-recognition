<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>novvan.us — Available</title>

    <meta name="description"
          content="novvan.us is available for acquisition. Contact us for purchase inquiries.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            background: #f7f8fa;
            color: #111827;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 24px;

            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.08);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 48px;

            border-bottom: 1px solid #f0f1f3;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            color: #6b7280;
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 80px 30px;
        }

        .content {
            max-width: 720px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 86px);

            line-height: 0.95;

            letter-spacing: -4px;

            font-weight: 750;

            margin-bottom: 28px;

            color: #111827;
        }

        .description {
            max-width: 560px;

            margin: 0 auto 38px;

            font-size: 18px;

            line-height: 1.7;

            color: #6b7280;
        }

        /* =========================
           BUTTON
        ========================= */

        .cta {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 16px 27px;

            border-radius: 10px;

            background: #111827;

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: all 0.2s ease;

            box-shadow: 0 8px 25px rgba(17, 24, 39, 0.18);
        }

        .cta:hover {
            transform: translateY(-2px);

            background: #000000;

            box-shadow: 0 12px 30px rgba(17, 24, 39, 0.22);
        }

        .arrow {
            font-size: 17px;

            transition: transform 0.2s ease;
        }

        .cta:hover .arrow {
            transform: translateX(3px);
        }

        /* =========================
           EMAIL
        ========================= */

        .email-note {
            margin-top: 20px;

            font-size: 13px;

            color: #9ca3af;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid #f0f1f3;

            padding: 24px 48px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            font-size: 12px;

            color: #9ca3af;
        }

        footer a {
            color: #6b7280;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #111827;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .page {
                min-height: calc(100vh - 24px);

                border-radius: 18px;
            }

            header {
                height: 68px;

                padding: 0 22px;
            }

            .status {
                display: none;
            }

            main {
                padding: 60px 22px;
            }

            h1 {
                font-size: 54px;

                letter-spacing: -2.5px;
            }

            .description {
                font-size: 16px;

                line-height: 1.6;
            }

            footer {
                padding: 20px 22px;

                flex-direction: column;

                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- HEADER -->

        <header>

            <div class="logo">
                NOVVAN
            </div>

            <div class="status">

                <span class="dot"></span>

                Available for acquisition

            </div>

        </header>


        <!-- MAIN -->

        <main>

            <div class="content">

                <h1>
                    novvan.us
                </h1>

                <p class="description">
                    A short, memorable and brandable domain name
                    available for acquisition.
                </p>


                <a
                    class="cta"
                    href="mailto:enquries@novvan.us?subject=novvan.us%20Domain%20Inquiry"
                >

                    Contact Seller

                    <span class="arrow">
                        →
                    </span>

                </a>


                <p class="email-note">
                    Purchase inquiries · enquries@novvan.us
                </p>

            </div>

        </main>


        <!-- FOOTER -->

        <footer>

            <span>
                © 2026 Novvan.us
            </span>

            <a href="mailto:enquries@novvan.us">
                Contact
            </a>

        </footer>

    </div>

</body>
</html>
