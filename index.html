<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continue</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff, var(--bg));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(90vw, 420px);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
        padding: 40px 30px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 28px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Continue</h1>
      <p>Welcome! Click below to continue to the next step.</p>
      <button type="button">Continue</button>
    </div>
  </body>
</html>
