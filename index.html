<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 50% 65%,
          rgba(55, 85, 180, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 20% 20%,
          rgba(70, 100, 255, 0.08),
          transparent 30%
        ),
        #020611;
    }

    /* ------------------------------
       STARS
    ------------------------------ */

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(150,200,255,.7) 1px, transparent 1.5px);

      background-size:
        190px 190px,
        270px 270px,
        330px 330px;

      background-position:
        20px 30px,
        100px 80px,
        40px 160px;

      opacity: .45;
    }

    .stars::before {
      background-image:
        radial-gradient(circle, white 1px, transparent 1.5px),
        radial-gradient(circle, rgba(130,180,255,.8) 1px, transparent 1.5px);

      background-size:
        410px 410px,
        520px 520px;

      background-position:
        180px 120px,
        250px 50px;

      opacity: .45;
    }

    /* ------------------------------
       NEBULA
    ------------------------------ */

    .nebula {
      position: absolute;

      width: 700px;
      height: 450px;

      top: 20%;
      left: 50%;

      transform: translateX(-50%);

      background:
        radial-gradient(
          ellipse,
          rgba(70, 110, 255, .12),
          rgba(70, 60, 180, .05) 40%,
          transparent 70%
        );

      filter: blur(35px);

      pointer-events: none;
    }

    /* ------------------------------
       CONTENT
    ------------------------------ */

    .content {
      position: relative;
      z-index: 5;

      height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px 20px 180px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 22px;

      color: #aeb9d4;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 6px;
      text-transform: uppercase;

      margin-bottom: 35px;
    }

    .eyebrow span {
      display: block;

      width: 45px;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #91a8ff
      );
    }

    .eyebrow span:last-child {
      background: linear-gradient(
        90deg,
        #91a8ff,
        transparent
      );
    }

    h1 {
      font-size: clamp(58px, 10vw, 125px);

      line-height: .9;

      font-weight: 700;

      letter-spacing: -5px;

      margin-bottom: 35px;
    }

    h1 .white {
      color: #fff;
    }

    h1 .gradient {
      background: linear-gradient(
        90deg,
        #6ee7ff,
        #6d8cff,
        #8b5cf6
      );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .description {
      max-width: 650px;

      color: #aeb8cc;

      font-size: 17px;
      line-height: 1.8;

      letter-spacing: 1px;

      margin-bottom: 35px;
    }

    /* ------------------------------
       CONTACT BUTTON
    ------------------------------ */

    .contact {
      display: inline-flex;

      align-items: center;

      gap: 13px;

      padding: 13px 25px;

      border: 1px solid rgba(150, 175, 255, .45);

      border-radius: 50px;

      color: #dbe5ff;

      text-decoration: none;

      font-size: 14px;

      background: rgba(10, 20, 50, .35);

      backdrop-filter: blur(8px);

      transition: all .3s ease;
    }

    .contact:hover {
      border-color: rgba(150, 190, 255, .9);

      box-shadow:
        0 0 30px rgba(80, 130, 255, .25);

      transform: translateY(-2px);
    }

    .contact-icon {
      font-size: 17px;
    }

    /* ------------------------------
       PLANET HORIZON
    ------------------------------ */

    .planet {
      position: absolute;

      width: 150%;
      height: 390px;

      left: -25%;
      bottom: -330px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(70, 110, 190, .45),
          rgba(12, 30, 75, .45) 35%,
          #01040b 70%
        );

      border-top: 2px solid rgba(100, 170, 255, .85);

      box-shadow:
        0 -5px 25px rgba(60, 130, 255, .7),
        0 -15px 60px rgba(60, 100, 255, .25);

      z-index: 2;
    }

    /* Horizon glow */

    .planet::before {
      content: "";

      position: absolute;

      width: 320px;
      height: 65px;

      left: 50%;
      top: -25px;

      transform: translateX(-50%);

      background: rgba(110, 180, 255, .7);

      filter: blur(35px);

      border-radius: 50%;
    }

    /* Sunrise */

    .planet::after {
      content: "";

      position: absolute;

      width: 6px;
      height: 6px;

      left: 50%;
      top: -5px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 12px 5px #fff,
        0 0 30px 12px rgba(100, 180, 255, .9);
    }

    /* ------------------------------
       FLOATING ORBIT
    ------------------------------ */

    .orbit {
      position: absolute;

      width: 480px;
      height: 150px;

      border: 1px solid rgba(120, 160, 255, .08);

      border-radius: 50%;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-12deg);

      pointer-events: none;
    }

    .orbit::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #79d8ff;

      box-shadow:
        0 0 12px #79d8ff;

      right: 8%;
      top: 12%;
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 600px) {

      .content {
        padding-bottom: 120px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 4px;
        gap: 12px;
      }

      .eyebrow span {
        width: 25px;
      }

      h1 {
        font-size: 62px;
        letter-spacing: -3px;
      }

      .description {
        font-size: 14px;
        line-height: 1.7;
        max-width: 340px;
      }

      .planet {
        width: 190%;
        left: -45%;
        bottom: -270px;
      }

      .orbit {
        width: 300px;
      }
    }
  </style>
</head>

<body>

  <!-- Background stars -->
  <div class="stars"></div>

  <!-- Nebula -->
  <div class="nebula"></div>

  <!-- Decorative orbit -->
  <div class="orbit"></div>

  <!-- Main content -->
  <main class="content">

    <div class="eyebrow">
      <span></span>
      Something New
      <span></span>
    </div>

    <h1>
      <span class="white">COMING</span>
      <span class="gradient">SOON</span>
    </h1>

    <p class="description">
      We're working on something exciting.<br>
      Something new is taking shape.<br>
      Stay tuned.
    </p>

    <a
      class="contact"
      href="mailto:your@email.com"
    >
      <span class="contact-icon">✉</span>
      Get in touch
    </a>

  </main>

  <!-- Planet -->
  <div class="planet"></div>

</body>
</html>
