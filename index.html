<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVVAN.US — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(
          ellipse at 50% 90%,
          rgba(45, 70, 180, 0.35) 0%,
          rgba(10, 20, 55, 0.18) 30%,
          #020814 65%
        ),
        #020814;

      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Stars */
    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(circle at 8% 65%, white 0 1px, transparent 2px),
        radial-gradient(circle at 16% 25%, white 0 1px, transparent 2px),
        radial-gradient(circle at 28% 78%, white 0 1px, transparent 2px),
        radial-gradient(circle at 38% 15%, white 0 1px, transparent 2px),
        radial-gradient(circle at 52% 28%, white 0 1px, transparent 2px),
        radial-gradient(circle at 65% 13%, white 0 1px, transparent 2px),
        radial-gradient(circle at 74% 67%, white 0 1px, transparent 2px),
        radial-gradient(circle at 82% 24%, white 0 1px, transparent 2px),
        radial-gradient(circle at 92% 78%, white 0 1px, transparent 2px);

      opacity: 0.65;
      pointer-events: none;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 5;

      min-height: 100vh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px 20px 180px;
    }

    /* Logo */
    .logo {
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 55px;
    }

    .logo-main {
      color: #ffffff;
    }

    .logo-dot {
      color: #6bdcff;
    }

    .logo-us {
      background: linear-gradient(
        90deg,
        #55e8ff,
        #4d8dff,
        #744dff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Small heading */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 32px;

      color: #e8edf8;

      font-size: 18px;
      letter-spacing: 9px;
      text-transform: uppercase;

      margin-bottom: 45px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";

      width: 50px;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #b9cfff
      );
    }

    .eyebrow::after {
      background: linear-gradient(
        90deg,
        #b9cfff,
        transparent
      );
    }

    /* Main title */
    h1 {
      font-size: clamp(58px, 10vw, 125px);
      line-height: 0.95;

      font-weight: 700;
      letter-spacing: -5px;

      margin-bottom: 45px;

      color: white;
    }

    h1 .gradient {
      background: linear-gradient(
        90deg,
        #ffffff 35%,
        #57e4ff 65%,
        #654cff 100%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Description */
    .description {
      max-width: 760px;

      color: #e0e4ee;

      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.9;

      letter-spacing: 2px;

      margin-bottom: 45px;
    }

    /* Contact */
    .contact {
      display: flex;
      align-items: center;

      min-width: 390px;

      padding: 17px 35px;

      border: 1.5px solid rgba(180, 196, 255, 0.8);
      border-radius: 60px;

      background: rgba(10, 20, 55, 0.3);

      box-shadow:
        0 0 25px rgba(80, 100, 255, 0.15),
        inset 0 0 20px rgba(80, 100, 255, 0.05);

      transition: 0.3s ease;
    }

    .contact:hover {
      transform: translateY(-3px);

      box-shadow:
        0 0 35px rgba(80, 120, 255, 0.35),
        inset 0 0 25px rgba(80, 100, 255, 0.1);
    }

    .email-icon {
      width: 35px;
      height: 28px;

      margin-right: 25px;

      position: relative;
    }

    .email-icon::before {
      content: "";

      position: absolute;
      inset: 0;

      border: 2px solid white;
      border-radius: 4px;
    }

    .email-icon::after {
      content: "";

      position: absolute;

      width: 17px;
      height: 17px;

      border-left: 2px solid white;
      border-bottom: 2px solid white;

      transform: rotate(-45deg);

      top: -3px;
      left: 7px;
    }

    .contact-divider {
      width: 1px;
      height: 35px;

      background: rgba(200, 210, 255, 0.6);

      margin-right: 25px;
    }

    .contact-text {
      text-align: left;
    }

    .contact-title {
      display: block;

      font-size: 19px;
      font-weight: 500;

      letter-spacing: 1px;

      margin-bottom: 3px;
    }

    .email {
      color: #91a8ff;

      font-size: 16px;
      letter-spacing: 0.5px;

      text-decoration: none;
    }

    /* Planet / horizon */
    .planet {
      position: absolute;

      width: 145%;
      height: 380px;

      left: -22.5%;
      bottom: -285px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(110, 160, 255, 0.5),
          rgba(25, 55, 130, 0.35) 25%,
          #020817 65%
        );

      border-top: 2px solid rgba(130, 185, 255, 0.9);

      box-shadow:
        0 -10px 45px rgba(60, 130, 255, 0.8),
        0 -2px 12px rgba(170, 220, 255, 0.9);
    }

    /* Horizon glow */
    .planet::before {
      content: "";

      position: absolute;

      width: 250px;
      height: 80px;

      top: -25px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(180, 220, 255, 0.9);

      filter: blur(35px);

      border-radius: 50%;
    }

    /* Horizon light */
    .planet::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      top: -5px;
      left: 50%;

      transform: translateX(-50%);

      background: white;

      border-radius: 50%;

      box-shadow:
        0 0 15px 5px white,
        0 0 35px 15px rgba(100, 170, 255, 0.8);
    }

    /* Responsive */
    @media (max-width: 600px) {

      .container {
        padding-bottom: 120px;
      }

      .logo {
        margin-bottom: 35px;
      }

      .eyebrow {
        gap: 12px;
        font-size: 12px;
        letter-spacing: 5px;
        margin-bottom: 30px;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 25px;
      }

      h1 {
        letter-spacing: -2px;
        margin-bottom: 30px;
      }

      .description {
        font-size: 14px;
        line-height: 1.7;
        letter-spacing: 1px;
      }

      .contact {
        min-width: 0;
        width: 100%;
        max-width: 360px;
        padding: 14px 20px;
      }

      .email-icon {
        margin-right: 15px;
      }

      .contact-divider {
        margin-right: 15px;
      }

      .contact-title {
        font-size: 16px;
      }

      .email {
        font-size: 13px;
      }

      .planet {
        width: 180%;
        left: -40%;
        bottom: -250px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Logo -->
    <div class="logo">
      <span class="logo-main">NOVVAN</span><span class="logo-dot">.</span><span class="logo-us">US</span>
    </div>

    <!-- Eyebrow -->
    <div class="eyebrow">
      Something New
    </div>

    <!-- Main heading -->
    <h1>
      COMING <span class="gradient">SOON</span>
    </h1>

    <!-- Description -->
    <p class="description">
      We're working on something exciting.<br>
      Our new website is currently under development<br>
      and will be launching soon.
    </p>

    <!-- Contact -->
    <div class="contact">

      <div class="email-icon"></div>

      <div class="contact-divider"></div>

      <div class="contact-text">
        <span class="contact-title">Get in touch</span>

        <a
          class="email"
          href="mailto:enquries@novvan.us"
        >
         enquries@novvan.us
        </a>
      </div>

    </div>

  </main>

  <!-- Planet -->
  <div class="planet"></div>

</body>
</html>
